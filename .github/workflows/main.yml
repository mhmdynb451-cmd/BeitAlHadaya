name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Android project
        run: |
          set -e

          ZIP_FILE="BeitAlHadaya_v1.2.1_GitHubBuild.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE=$(find project -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project contents:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( \
            -name "settings.gradle.kts" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \
          \) -print

          echo ""
          echo "Using Gradle:"
          gradle --version

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/BeitAlHadaya-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: apk-output/BeitAlHadaya-debug.apk
          if-no-files-found: error

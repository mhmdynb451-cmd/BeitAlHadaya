name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          if [ -f "BeitAlHadaya_v1.2.1_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_v1.2.1_GitHubBuild.zip"
          elif [ -f "BeitAlHadaya_Android_v0.3_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_Android_v0.3_GitHubBuild.zip"
          else
            echo "ERROR: No Android project ZIP file was found."
            exit 1
          fi

          echo "Using source package: $SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d project

          SETTINGS_FILE="$(
            find project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            echo "Extracted files:"
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            echo "Project directory detected: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            echo "Project directory detected: $PROJECT_DIR"
            find "$PROJECT_DIR/app" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          echo "Gradle-related files detected:"
          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print | sort

      - name: Force Gradle Wrapper 8.13
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/gradle/wrapper/gradle-wrapper.properties" \
              -print \
              -quit
          )"

          if [ -z "$WRAPPER_FILE" ]; then
            echo "ERROR: gradle-wrapper.properties was not found."
            echo "Searching entire project:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/gradle/*" \
              -print | sort
            exit 1
          fi

          echo "Gradle Wrapper file:"
          echo "$WRAPPER_FILE"

          python3 - "$WRAPPER_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          output = []
          found_distribution = False

          for line in lines:
              if line.startswith("distributionUrl="):
                  output.append(
                      r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip"
                  )
                  found_distribution = True
              elif line.startswith("distributionSha256Sum="):
                  continue
              else:
                  output.append(line)

          if not found_distribution:
              output.append(
                  r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip"
              )

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )
          PY

          echo "Updated Gradle Wrapper configuration:"
          grep -n "distributionUrl" "$WRAPPER_FILE"

          GRADLE_WRAPPER="$(dirname "$WRAPPER_FILE")/../.."
          GRADLEW="$PROJECT_DIR/gradlew"

          if [ -f "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            echo "Gradle Wrapper executable:"
            ls -l "$GRADLEW"
          else
            echo "ERROR: gradlew was not found at:"
            echo "$GRADLEW"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            project/**/*.gradle*
            project/**/gradle.properties
            project/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Configured system Gradle:"
          gradle --version

          echo
          echo "Gradle Wrapper version:"
          ./gradlew --version

          WRAPPER_VERSION="$(
            ./gradlew --version \
              | awk '/^Gradle / {print $2; exit}'
          )"

          echo
          echo "Detected Wrapper Gradle version: $WRAPPER_VERSION"

          if [ "$WRAPPER_VERSION" != "8.13" ]; then
            echo "ERROR: Gradle Wrapper is not using 8.13."
            exit 1
          fi

          echo "Gradle 8.13 verification: OK"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          if ! grep -qxF "android.useAndroidX=true" "$GRADLE_PROPERTIES"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -qxF "android.enableJetifier=true" "$GRADLE_PROPERTIES"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPERTIES"
          fi

          echo "AndroidX configuration:"
          cat "$GRADLE_PROPERTIES"

      - name: Configure Java and Kotlin JVM 17
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          path.write_text(text, encoding="utf-8")
          PY

          echo "Java/Kotlin JVM 17 configuration checked."

      - name: Apply safe MainActivity fixes
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find "$PROJECT_DIR/app/src/main/java" \
              -type f \
              -name "MainActivity.kt" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found under app/src/main/java."
            echo "Continuing without MainActivity patching."
            exit 0
          fi

          echo "MainActivity detected at:"
          echo "$MAIN_ACTIVITY"

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          uses_local_layout_direction = bool(
              re.search(r"\bLocalLayoutDirection\b", text)
          )

          has_local_layout_import = bool(
              re.search(
                  r"^\s*import\s+androidx\.compose\.ui\.platform\.LocalLayoutDirection\s*$",
                  text,
                  re.MULTILINE,
              )
          )

          if uses_local_layout_direction and not has_local_layout_import:
              import_matches = list(
                  re.finditer(r"^import .*$", text, re.MULTILINE)
              )

              import_line = (
                  "import androidx.compose.ui.platform.LocalLayoutDirection\n"
              )

              if import_matches:
                  insert_at = import_matches[-1].end() + 1
                  text = (
                      text[:insert_at]
                      + import_line
                      + text[insert_at:]
                  )
              else:
                  package_match = re.search(
                      r"^package .*$",
                      text,
                      re.MULTILINE,
                  )

                  if package_match:
                      insert_at = package_match.end() + 1
                      text = (
                          text[:insert_at]
                          + "\n"
                          + import_line
                          + text[insert_at:]
                      )

          text = re.sub(
              r'enabled\s*=\s*([^,\n]+),\s*Modifier\.fillMaxWidth\(\)\)',
              r'enabled = \1, modifier = Modifier.fillMaxWidth())',
              text,
          )

          if (
              "ExperimentalMaterial3Api" in text
              and "@OptIn(ExperimentalMaterial3Api::class)" not in text
              and "fun StoreApp()" in text
          ):
              text = text.replace(
                  "fun StoreApp()",
                  "@OptIn(ExperimentalMaterial3Api::class)\n"
                  "fun StoreApp()",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "MainActivity safe fixes checked."

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/gradlew"

          echo "Gradle project verification: OK"
          echo "Project directory: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Final Gradle version used for APK build:"
          ./gradlew --version

          echo
          echo "Starting assembleDebug..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "Available build outputs:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print | sort || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BeitAlHadaya-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

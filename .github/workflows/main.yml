name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: beit-al-hadaya-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BeitAlHadaya V1.2.2 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BeitAlHadaya_v1.2.2_GitHubBuild.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Repository files:"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          }

          unzip -tq "$ZIP_FILE"

          echo "Source ZIP verified: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

      - name: Extract and locate V1.2.2 Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BeitAlHadaya_v1.2.2_GitHubBuild.zip"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

          mapfile -t SETTINGS_FILES < <(
            find build-source -type f -name 'settings.gradle.kts' -print | sort
          )

          PROJECT_DIR=""

          for settings_file in "${SETTINGS_FILES[@]}"; do
            candidate_dir="$(dirname "$settings_file")"

            if [[ -f "$candidate_dir/build.gradle.kts" &&
                  -f "$candidate_dir/app/build.gradle.kts" &&
                  -f "$candidate_dir/app/src/main/AndroidManifest.xml" ]]; then

              if [[ -n "$PROJECT_DIR" ]]; then
                echo "ERROR: More than one valid Android project root was found."
                echo "Existing: $PROJECT_DIR"
                echo "Another:  $candidate_dir"
                exit 1
              fi

              PROJECT_DIR="$candidate_dir"
            fi
          done

          [[ -n "$PROJECT_DIR" ]] || {
            echo "ERROR: No valid Android project root was found inside $ZIP_FILE."
            echo "Extracted Gradle files:"
            find build-source -type f \
              \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' \) \
              -print | sort
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected Android project:"
          echo "$PROJECT_DIR"

          echo "Top-level project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f -print | sort

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          dependency-graph: disabled
          cache-disabled: true
          validate-wrappers: false

      - name: Validate and normalize V1.2.2 build configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/build.gradle.kts" "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re
          import sys

          root_path = Path(sys.argv[1])
          app_path = Path(sys.argv[2])

          root = root_path.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")

          required_root = {
              "Android Gradle Plugin 8.13.2":
                  r'id\("com\.android\.application"\)\s+version\s+"8\.13\.2"\s+apply\s+false',

              "Kotlin Android plugin 2.3.21":
                  r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"2\.3\.21"\s+apply\s+false',
          }

          required_app = {
              "compileSdk 36":
                  r'\bcompileSdk\s*=\s*36\b',

              "targetSdk 36":
                  r'\btargetSdk\s*=\s*36\b',

              "versionCode 6":
                  r'\bversionCode\s*=\s*6\b',

              "versionName 1.2.2":
                  r'\bversionName\s*=\s*"1\.2\.2"\b',

              "Supabase BOM 3.8.0":
                  r'io\.github\.jan-tennert\.supabase:bom:3\.8\.0',

              "Ktor 3.6.0":
                  r'io\.ktor:ktor-client-android:3\.6\.0',
          }

          missing = []

          for label, pattern in required_root.items():
              if not re.search(pattern, root):
                  missing.append(label)

          for label, pattern in required_app.items():
              if not re.search(pattern, app):
                  missing.append(label)

          if missing:
              raise SystemExit(
                  "ERROR: V1.2.2 build configuration is missing: "
                  + ", ".join(missing)
              )

          compose_bom_pattern = (
              r'(androidx\.compose:compose-bom:)'
              r'([0-9]{4}\.[0-9]{2}\.[0-9]{2})'
          )

          match = re.search(compose_bom_pattern, app)

          if not match:
              raise SystemExit(
                  "ERROR: No Jetpack Compose BOM was found "
                  "in app/build.gradle.kts."
              )

          current_bom = match.group(2)
          safe_bom = "2026.06.01"

          if current_bom != safe_bom:
              app = re.sub(
                  compose_bom_pattern,
                  rf'\g<1>{safe_bom}',
                  app,
                  count=1
              )

              app_path.write_text(
                  app.rstrip() + "\n",
                  encoding="utf-8"
              )

              print(
                  f"Compose BOM normalized from "
                  f"{current_bom} to {safe_bom}."
              )
          else:
              print(
                  f"Compose BOM already pinned to {safe_bom}."
              )

          app_after = app_path.read_text(encoding="utf-8")

          if "androidx.compose:compose-bom:2026.06.01" not in app_after:
              raise SystemExit(
                  "ERROR: Compose BOM was not normalized "
                  "to 2026.06.01."
              )

          print("V1.2.2 build configuration validation passed.")
          PY

          if grep -RniE 'service_role|sb_secret_' "$PROJECT_DIR/app/src"; then
            echo "ERROR: Secret/service-role credential detected in Android source."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/gradle.properties" ]]; then
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
              'android.useAndroidX=true' \
              > "$PROJECT_DIR/gradle.properties"
          else
            grep -qxF 'android.useAndroidX=true' "$PROJECT_DIR/gradle.properties" || \
              printf '\n%s\n' 'android.useAndroidX=true' \
              >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project verification passed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/BeitAlHadaya-v1.2.2-debug.apk

          echo "APK:"
          ls -lh apk-output/BeitAlHadaya-v1.2.2-debug.apk

          echo "SHA-256:"
          sha256sum apk-output/BeitAlHadaya-v1.2.2-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BeitAlHadaya-v1.2.2-debug-apk
          path: apk-output/BeitAlHadaya-v1.2.2-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          if [ -f "BeitAlHadaya_v1.2.1_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_v1.2.1_GitHubBuild.zip"
          elif [ -f "BeitAlHadaya_Android_v0.3_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_Android_v0.3_GitHubBuild.zip"
          else
            echo "ERROR: No Android project ZIP file was found."
            exit 1
          fi

          echo "Using source package: $SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d project

          SETTINGS_FILE="$(
            find project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            echo "Extracted files:"
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            echo "Project directory detected: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            echo "Project directory detected: $PROJECT_DIR"
            find "$PROJECT_DIR/app" -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          echo "Gradle-related files detected:"
          find "$PROJECT_DIR" \
            -type f \
            \
              -name "settings.gradle.kts" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \
            -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            project/**/*.gradle*
            project/**/gradle.properties
            project/**/settings.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          echo "Configured system Gradle:"
          gradle --version

          GRADLE_VERSION="$(
            gradle --version \
              | awk '/^Gradle / {print $2; exit}'
          )"

          echo "Detected Gradle version: $GRADLE_VERSION"

          if [ "$GRADLE_VERSION" != "8.13" ]; then
            echo "ERROR: Gradle 8.13 is required."
            exit 1
          fi

          echo "Gradle 8.13 verification: OK"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          if ! grep -qxF "android.useAndroidX=true" "$GRADLE_PROPERTIES"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -qxF "android.enableJetifier=true" "$GRADLE_PROPERTIES"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPERTIES"
          fi

          echo "AndroidX configuration:"
          cat "$GRADLE_PROPERTIES"

      - name: Configure Java and Kotlin JVM 17
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          path.write_text(text, encoding="utf-8")
          PY

          echo "Java/Kotlin JVM 17 configuration checked."

      - name: Apply safe MainActivity fixes
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find "$PROJECT_DIR/app/src/main" \
              -type f \
              -name "MainActivity.kt" \
              -print \
              -quit
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."
           

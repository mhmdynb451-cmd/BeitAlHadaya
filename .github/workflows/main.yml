name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "BeitAlHadaya_v1.2.1_GitHubBuild.zip" ]; then
            ZIP_FILE="BeitAlHadaya_v1.2.1_GitHubBuild.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name 'BeitAlHadaya*_GitHubBuild.zip' | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android source ZIP file was found."
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE="$(find project -type f -name 'settings.gradle.kts' | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            echo
            echo "Project files detected:"
            find project -maxdepth 5 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle settings file: $SETTINGS_FILE"
          echo "Android project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo

          echo "Important Gradle files:"
          find "$PROJECT_DIR" -type f \
            \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) \
            -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES_FILE"

          if ! grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPERTIES_FILE"
          fi

          if ! grep -q '^android.enableJetifier=' "$PROPERTIES_FILE"; then
            echo 'android.enableJetifier=true' >> "$PROPERTIES_FILE"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPERTIES_FILE"
          fi

          echo "AndroidX settings:"
          grep -E '^android\.(useAndroidX|enableJetifier)=' "$PROPERTIES_FILE"

      - name: Fix Kotlin compilerOptions migration
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          project_dir = Path(sys.argv[1])

          candidates = list(project_dir.glob("app/build.gradle.kts"))

          if not candidates:
              candidates = list(project_dir.rglob("build.gradle.kts"))

          if not candidates:
              print("ERROR: No build.gradle.kts file found.")
              sys.exit(1)

          build_file = None

          for candidate in candidates:
              text = candidate.read_text(encoding="utf-8")
              if "kotlinOptions" in text or "com.android.application" in text:
                  build_file = candidate
                  break

          if build_file is None:
              build_file = candidates[0]

          text = build_file.read_text(encoding="utf-8")

          print(f"Target Kotlin Gradle file: {build_file}")

          def find_matching_brace(source: str, opening_index: int) -> int:
              depth = 0
              in_string = False
              in_line_comment = False
              in_block_comment = False
              escape = False
              i = opening_index

              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ""

                  if in_line_comment:
                      if ch == "\n":
                          in_line_comment = False
                  elif in_block_comment:
                      if ch == "*" and nxt == "/":
                          in_block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == "/" and nxt == "/":
                          in_line_comment = True
                          i += 1
                      elif ch == "/" and nxt == "*":
                          in_block_comment = True
                          i += 1
                      elif ch == '"':
                          in_string = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return i

                  i += 1

              raise RuntimeError("Could not find matching closing brace.")

          # Remove legacy kotlinOptions only if it is inside the android { ... } block.
          android_match = None

          search_from = 0
          while True:
              idx = text.find("android", search_from)
              if idx == -1:
                  break

              brace = text.find("{", idx)
              if brace == -1:
                  break

              end = find_matching_brace(text, brace)

              if text[brace:end + 1].startswith("{"):
                  android_match = (idx, brace, end)
                  break

              search_from = idx + len("android")

          if android_match is None:
              print("WARNING: android { ... } block was not found.")
          else:
              _, android_brace, android_end = android_match
              android_block = text[android_brace:android_end + 1]

              kotlin_index = android_block.find("kotlinOptions")

              if kotlin_index != -1:
                  absolute_index = android_brace + kotlin_index
                  kotlin_brace = text.find("{", absolute_index)

                  if kotlin_brace == -1:
                      print("ERROR: kotlinOptions opening brace was not found.")
                      sys.exit(1)

                  kotlin_end = find_matching_brace(text, kotlin_brace)

                  line_start = text.rfind("\n", 0, absolute_index) + 1

                  text = text[:line_start] + text[kotlin_end + 1:]

                  print("Removed legacy android.kotlinOptions block.")
              else:
                  print("No legacy android.kotlinOptions block found.")

          # Add the correct Kotlin compilerOptions block at top level.
          compiler_block = """\
          kotlin {
              compilerOptions {
                  jvmTarget = JvmTarget.JVM_17
              }
          }

          """

          if "jvmTarget = JvmTarget.JVM_17" not in text:
              android_position = text.find("android {")

              if android_position == -1:
                  print("ERROR: android { block not found while inserting compilerOptions.")
                  sys.exit(1)

              if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
                  text = (
                      "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n"
                      + text
                  )

              text = (
                  text[:android_position]
                  + compiler_block
                  + text[android_position:]
              )

              print("Added top-level kotlin { compilerOptions { ... } } block.")
          else:
              print("Correct Kotlin compilerOptions block already exists.")

          # Add Java 17 compile options inside android if they are missing.
          if "compileOptions {" not in text:
              android_position = text.find("android {")

              if android_position == -1:
                  print("ERROR: android { block not found while adding compileOptions.")
                  sys.exit(1)

              android_open = text.find("{", android_position)
              android_end = find_matching_brace(text, android_open)

              compile_block = """\
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              """

              insert_at = android_open + 1

              text = text[:insert_at] + compile_block + text[insert_at:]

              print("Added Java 17 compileOptions.")
          else:
              print("compileOptions already exists.")

          # Final validation.
          if "kotlinOptions" in text:
              print("ERROR: Legacy kotlinOptions still exists.")
              sys.exit(1)

          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              print("ERROR: JvmTarget import is missing.")
              sys.exit(1)

          if "kotlin {" not in text:
              print("ERROR: Top-level kotlin block is missing.")
              sys.exit(1)

          if "jvmTarget = JvmTarget.JVM_17" not in text:
              print("ERROR: JVM 17 compiler target is missing.")
              sys.exit(1)

          build_file.write_text(text, encoding="utf-8")

          print()
          print("Kotlin migration completed successfully.")
          print("Final validation passed.")
          PY

      - name: Show patched Gradle file
        shell: bash
        run: |
          set -euo pipefail

          APP_BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_BUILD_FILE" ]; then
            APP_BUILD_FILE="$(find "$PROJECT_DIR" -type f -name 'build.gradle.kts' | head -n 1)"
          fi

          echo "Final Gradle file: $APP_BUILD_FILE"
          echo
          sed -n '1,220p' "$APP_BUILD_FILE"

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            test -f "$PROJECT_DIR/app/build.gradle.kts"
          fi

          echo "Gradle project validation passed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            echo
            echo "Available APK files:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print | sort || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/artifacts/BeitAlHadaya-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: artifacts/BeitAlHadaya-debug.apk
          if-no-files-found: error

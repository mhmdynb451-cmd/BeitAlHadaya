name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BeitAlHadaya V1.2.2 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          dependency-graph: disabled

      - name: Extract and validate V1.2.2 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BeitAlHadaya_v1.2.2_GitHubBuild.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            exit 1
          }

          rm -rf build-source
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

          mapfile -t SETTINGS_FILES < <(
            find build-source -type f -name 'settings.gradle.kts' -print
          )

          PROJECT_DIR=""

          for settings_file in "${SETTINGS_FILES[@]}"; do
            candidate_dir="$(dirname "$settings_file")"

            if [[ -f "$candidate_dir/build.gradle.kts" &&
                  -f "$candidate_dir/app/build.gradle.kts" &&
                  -f "$candidate_dir/app/src/main/AndroidManifest.xml" ]]; then

              if [[ -n "$PROJECT_DIR" ]]; then
                echo "ERROR: More than one valid Android project root was found."
                exit 1
              fi

              PROJECT_DIR="$candidate_dir"
            fi
          done

          [[ -n "$PROJECT_DIR" ]] || {
            echo "ERROR: No valid Android project root was found inside $ZIP_FILE."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project: $PROJECT_DIR"

      - name: Validate and repair V1.2.2 build configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/build.gradle.kts" "$PROJECT_DIR/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys

          app_path = Path(sys.argv[1])
          root_path = Path(sys.argv[2])

          app = app_path.read_text(encoding="utf-8")
          root = root_path.read_text(encoding="utf-8")

          required_markers = {
              "AGP 8.13.2": 'id("com.android.application") version "8.13.2" apply false',
              "Kotlin 2.3.21": 'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              "compileSdk 36": "compileSdk = 36",
              "targetSdk 36": "targetSdk = 36",
              "versionCode 6": "versionCode = 6",
              "versionName 1.2.2": 'versionName = "1.2.2"',
              "Supabase BOM 3.8.0": "io.github.jan-tennert.supabase:bom:3.8.0",
              "Ktor 3.6.0": "io.ktor:ktor-client-android:3.6.0",
          }

          missing = [
              name
              for name, marker in required_markers.items()
              if marker not in (root + "\n" + app)
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Required V1.2.2 source markers are missing: "
                  + ", ".join(missing)
              )

          old_bom = "androidx.compose:compose-bom:2026.08.00"
          safe_bom = "androidx.compose:compose-bom:2026.06.01"

          if old_bom in app:
              app = app.replace(old_bom, safe_bom, 1)

          app_path.write_text(app.rstrip() + "\n", encoding="utf-8")

          if safe_bom not in app:
              raise SystemExit(
                  "ERROR: Compose BOM was not pinned to 2026.06.01."
              )

          print(
              "V1.2.2 build configuration validated. "
              "Compose BOM pinned to 2026.06.01 for AGP/SDK 36 compatibility."
          )
          PY

          if grep -RniE 'service_role|sb_secret_' "$PROJECT_DIR/app/src"; then
            echo "ERROR: Secret/service-role credential detected in Android source."
            exit 1
          fi

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          java -version
          gradle --version

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/BeitAlHadaya-v1.2.2-debug.apk

          sha256sum apk-output/BeitAlHadaya-v1.2.2-debug.apk
          ls -lh apk-output/BeitAlHadaya-v1.2.2-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BeitAlHadaya-v1.2.2-debug-apk
          path: apk-output/BeitAlHadaya-v1.2.2-debug.apk
          if-no-files-found: error

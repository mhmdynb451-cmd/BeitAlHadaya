name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q BeitAlHadaya_Android_v0.3_GitHubBuild.zip -d project

      - name: Enable AndroidX
        working-directory: project/beit_v03
        run: |
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Fix JVM targets
        working-directory: project/beit_v03
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Fix MainActivity Kotlin errors
        working-directory: project/beit_v03
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/beitalhadaya/app/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          if "import androidx.compose.ui.platform.LocalLayoutDirection" not in text:
              text = text.replace(
                  "import androidx.compose.ui.unit.LayoutDirection",
                  "import androidx.compose.ui.platform.LocalLayoutDirection\nimport androidx.compose.ui.unit.LayoutDirection"
              )

          text = text.replace(
              "enabled = name.isNotBlank() && phone.isNotBlank() && city.isNotBlank() && details.isNotBlank(), Modifier.fillMaxWidth())",
              "enabled = name.isNotBlank() && phone.isNotBlank() && city.isNotBlank() && details.isNotBlank(), modifier = Modifier.fillMaxWidth())"
          )

          if "@OptIn(ExperimentalMaterial3Api::class)" not in text:
              text = text.replace(
                  "@Composable\nfun StoreApp()",
                  "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun StoreApp()"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: project/beit_v03
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: project/beit_v03
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: project/beit_v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BeitAlHadaya Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="BeitAlHadaya_v1.2.1_GitHubBuild.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: Source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE="$(find project -type f -name 'settings.gradle.kts' -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle.kts was not found after extracting the source ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"
          touch "$PROPERTIES_FILE"

          if grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPERTIES_FILE"
          else
            echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"
          fi

          if grep -q '^android.enableJetifier=' "$PROPERTIES_FILE"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPERTIES_FILE"
          else
            echo 'android.enableJetifier=true' >> "$PROPERTIES_FILE"
          fi

          echo "AndroidX configuration:"
          grep -E '^android\.(useAndroidX|enableJetifier)=' "$PROPERTIES_FILE"

      - name: Normalize Gradle Wrapper to 8.13
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER_PROPERTIES" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          distribution_url = r"https\://services.gradle.org/distributions/gradle-8.13-bin.zip"

          if re.search(r"(?m)^distributionUrl=", text):
              text = re.sub(
                  r"(?m)^distributionUrl=.*$",
                  "distributionUrl=" + distribution_url,
                  text,
              )
          else:
              text = text.rstrip() + "\ndistributionUrl=" + distribution_url + "\n"

          path.write_text(text, encoding="utf-8")
          print("Gradle Wrapper normalized to 8.13.")
          PY

          grep '^distributionUrl=' "$WRAPPER_PROPERTIES"

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Remove the legacy kotlinOptions block used by older Kotlin configurations.
          text = re.sub(
              r'(?ms)^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}[ \t]*$',
              lambda m: "" if "jvmTarget" in m.group(0) else m.group(0),
              text,
          )

          # Keep Android Java compilation on JVM 17.
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.rstrip() + """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          # Use the modern Kotlin compilerOptions API without adding imports.
          modern_target = "jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)"

          if modern_target not in text:
              text = text.rstrip() + """

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """

          path.write_text(text.rstrip() + "\n", encoding="utf-8")
          print("Java 17 and modern Kotlin JVM 17 configuration applied.")
          PY

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -x gradlew

          echo "Gradle version from project wrapper:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK_FILE" ]]; then
            echo "ERROR: Debug APK was not generated."
            echo "APK files found:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/BeitAlHadaya-debug.apk

          echo "APK ready:"
          ls -lh apk-output/BeitAlHadaya-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: apk-output/BeitAlHadaya-debug.apk
          if-no-files-found: error

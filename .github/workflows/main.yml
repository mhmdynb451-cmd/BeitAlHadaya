name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q BeitAlHadaya_Android_v0.3_GitHubBuild.zip -d project

      - name: Build APK
        working-directory: project/beit_v03
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: project/beit_v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Android project
        run: |
          set -e

          ZIP_FILE="BeitAlHadaya_v1.2.1_GitHubBuild.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          SETTINGS_FILE=$(find project -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin compilerOptions
        run: |
          set -e

          APP_GRADLE=$(find "$PROJECT_DIR" -type f -path "*/app/build.gradle.kts" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Fixing Kotlin compilerOptions in:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          old_pattern = r'''
          \s*kotlinOptions\s*\{\s*
              jvmTarget\s*=\s*["']17["']\s*
          \}
          '''

          text, count = re.subn(
              old_pattern,
              "",
              text,
              flags=re.VERBOSE
          )

          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n" + text

          modern_block = """
          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          """

          if "jvmTarget.set(JvmTarget.JVM_17)" not in text:
              text = text.rstrip() + "\n\n" + modern_block.strip() + "\n"

          path.write_text(text)

          print(f"Old jvmTarget blocks removed: {count}")
          print("Modern Kotlin compilerOptions configured successfully.")
          PY

      - name: Verify Android project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project contents:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( \
            -name "settings.gradle.kts" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \
          \) -print

          echo ""
          echo "Using Gradle:"
          gradle --version

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/BeitAlHadaya-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: apk-output/BeitAlHadaya-debug.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          if [ -f "BeitAlHadaya_v1.2.1_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_v1.2.1_GitHubBuild.zip"
          elif [ -f "BeitAlHadaya_Android_v0.3_GitHubBuild.zip" ]; then
            SOURCE_ZIP="BeitAlHadaya_Android_v0.3_GitHubBuild.zip"
          else
            echo "ERROR: No Android project ZIP file was found."
            exit 1
          fi

          echo "Using source package: $SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d project

          SETTINGS_FILE="$(find project -type f -name "settings.gradle.kts" -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR/app" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES_FILE"

          if ! grep -q "^android.useAndroidX=" "$PROPERTIES_FILE"; then
            echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
          fi

          if ! grep -q "^android.enableJetifier=" "$PROPERTIES_FILE"; then
            echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"
          fi

      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          echo "Checking Kotlin configuration:"
          grep -n -E "kotlinOptions|compilerOptions|jvmTarget" "$BUILD_FILE" || true

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old = text

          # Migrate the old Kotlin DSL block.
          text = text.replace(
              "kotlinOptions {",
              "compilerOptions {"
          )

          text = text.replace(
              'jvmTarget = "17"',
              "jvmTarget.set(JvmTarget.JVM_17)"
          )

          text = text.replace(
              'jvmTarget = \'17\'',
              "jvmTarget.set(JvmTarget.JVM_17)"
          )

          # Add the required JvmTarget import when the new DSL is present.
          if "compilerOptions {" in text and "JvmTarget" in text:
              import_line = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"

              if import_line not in text:
                  text = import_line + "\n" + text

          path.write_text(text, encoding="utf-8")

          if text == old:
              print("No Kotlin JVM target change was necessary.")
          else:
              print("Kotlin JVM target configuration was migrated successfully.")
          PY

          echo "Final Kotlin configuration:"
          grep -n -E "JvmTarget|kotlinOptions|compilerOptions|jvmTarget" "$BUILD_FILE" || true

      - name: Configure Java 17 compatibility
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "android {"

              if marker in text:
                  replacement = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

                  text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "settings.gradle.kts:"
          test -f "$PROJECT_DIR/settings.gradle.kts"

          echo
          echo "app/build.gradle.kts:"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo
          echo "AndroidManifest.xml:"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo
          echo "Important Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -print | sort

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Final Gradle version:"
          gradle --version

          echo
          echo "Starting assembleDebug..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not found."
            echo "APK search results:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          test -s "$APK_FILE"

          echo "APK size:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Check source ZIP
        run: |
          set -e
          test -f BeitAlHadaya_Android_v0.3_GitHubBuild.zip
          ls -lh BeitAlHadaya_Android_v0.3_GitHubBuild.zip

      - name: Unpack Android project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q BeitAlHadaya_Android_v0.3_GitHubBuild.zip -d project

          echo "===== Extracted files ====="
          find project -maxdepth 5 -type f | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "===== Searching for Gradle settings ====="

          SETTINGS_FILE="$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "===== All extracted files ====="
            find project -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Found settings file:"
          echo "$SETTINGS_FILE"

          echo "Gradle project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not found beside the Gradle settings file."
            echo "===== Files in project directory ====="
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          echo "Using project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/gradlew"

          chmod +x "$PROJECT_DIR/gradlew"

          test -x "$PROJECT_DIR/gradlew"

          echo "===== Gradle wrapper ====="
          "$PROJECT_DIR/gradlew" --version

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          grep -qxF 'android.useAndroidX=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' >> \
            "$PROJECT_DIR/gradle.properties"

          grep -qxF 'android.enableJetifier=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.enableJetifier=true' >> \
            "$PROJECT_DIR/gradle.properties"

      - name: Show Android project structure
        shell: bash
        run: |
          set -e

          echo "===== Project directory ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== Searching for APK ====="

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not found."
            echo "===== Build outputs ====="
            find "$PROJECT_DIR" -type f \
              -path "*/build/outputs/*" \
              -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeitAlHadaya-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
